[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pandoc-allium"
version = "0.1.0"
description = "Pandoc filter that runs `allium check` on fenced allium code blocks and reports diagnostics inline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "panflute>=2.3.1",
]

[project.scripts]
pandoc-allium = "pandoc_allium.filter:main"

[tool.setuptools.packages.find]
include = ["pandoc_allium*"]
