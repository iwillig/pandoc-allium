[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pandoc-allium"
version = "0.1.0"
description = "Pandoc filter that runs `allium check` on fenced allium code blocks and reports diagnostics inline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ivan Willig", email = "iwillig@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Filters",
    "Topic :: Documentation",
]
dependencies = [
    "panflute>=2.3.1",
]

[project.urls]
Homepage = "https://github.com/iwillig/pandoc-allium"
Repository = "https://github.com/iwillig/pandoc-allium"
Issues = "https://github.com/iwillig/pandoc-allium/issues"

[project.scripts]
pandoc-allium = "pandoc_allium.filter:main"

[tool.setuptools.packages.find]
include = ["pandoc_allium*"]

[tool.setuptools.package-data]
pandoc_allium = ["syntax/*.xml", "static/*.css"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
